    # Load the perl modules & repository configurations
	PerlSwitches -I/opt/eprints3/perl_lib
	PerlModule EPrints
	PerlPostConfigHandler +EPrints::post_config_handler

<VirtualHost *:80>
        ServerName cmabstracts.com
		ServerAlias www.cmabstracts.com
		ServerAlias arcomabstracts.com
		ServerAlias www.arcomabstracts.com

    DocumentRoot /var/www/html

    # Let’s Encrypt challenge response location
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory "/var/www/html/.well-known/acme-challenge/">
        AllowOverride None
        Options None
        Require all granted
    </Directory>

    # Redirect everything else to HTTPS
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
	  ServerName cmabstracts.com
	  ServerAlias www.cmabstracts.com
	  ServerAlias arcomabstracts.com
	  ServerAlias www.arcomabstracts.com
	  ServerAdmin abstracts@arcom.ac.uk
	  Header set Strict-Transport-Security "max-age=15780000"

	  # Docroot
	  DocumentRoot "/var/www/arcom"
	  
	  <Directory "/var/www/arcom">
		Options Indexes FollowSymLinks Multiviews
		AllowOverride None
		Require all granted
	  </Directory>

	  # Logging (commented out lines are useful for parallel repos)
	# ErrorLog "/var/log/apache2/arcomabstracts.com_443_error_ssl.log"
	# ServerSignature Off
	# CustomLog "/var/log/apache2/arcomabstracts.com_443_access_ssl.log" combined
	  ErrorLog ${APACHE_LOG_DIR}/error.log
      CustomLog ${APACHE_LOG_DIR}/access.log combined

	  # SSL directives (Revised 2025-06-24 with John Salter)
	  SSLEngine on
	  SSLCertificateFile      "/etc/letsencrypt/live/arcomabstracts.com/fullchain.pem"
	  SSLCertificateKeyFile   "/etc/letsencrypt/live/arcomabstracts.com/privkey.pem"
	#  SSLCACertificatePath    "/etc/pki/tls/certs"
	  SSLProtocol             All -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
 

	  PerlTransHandler +EPrints::Apache::Rewrite

	  # EPrints core config
	  Include /opt/eprints3/cfg/apache_ssl/arcom.conf
	  

	  Header set X-Frame-Options "SAMEORIGIN"
	  Header always set X-Content-Type-Options "nosniff"
	  Header set Content-Security-Policy "frame-ancestors 'self';"

</VirtualHost>

<VirtualHost *:80>
    ServerName stats.arcomabstracts.com
    Redirect permanent / https://stats.arcomabstracts.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName stats.arcomabstracts.com
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/stats.arcomabstracts.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/stats.arcomabstracts.com/privkey.pem
	
    RemoteIPHeader CF-Connecting-IP
    RemoteIPTrustedProxy 103.21.244.0/22
    RemoteIPTrustedProxy 103.22.200.0/22
    RemoteIPTrustedProxy 103.31.4.0/22
    RemoteIPTrustedProxy 104.16.0.0/13
    RemoteIPTrustedProxy 104.24.0.0/14
    RemoteIPTrustedProxy 108.162.192.0/18
    RemoteIPTrustedProxy 131.0.72.0/22
    RemoteIPTrustedProxy 141.101.64.0/18
    RemoteIPTrustedProxy 162.158.0.0/15
    RemoteIPTrustedProxy 172.64.0.0/13
    RemoteIPTrustedProxy 173.245.48.0/20
    RemoteIPTrustedProxy 188.114.96.0/20
    RemoteIPTrustedProxy 190.93.240.0/20
    RemoteIPTrustedProxy 197.234.240.0/22
    RemoteIPTrustedProxy 198.41.128.0/17
	
    ProxyPreserveHost On
    ProxyPass / http://localhost:3000/
    ProxyPassReverse / http://localhost:3000/
</VirtualHost>

